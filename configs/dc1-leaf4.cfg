! Startup config of dc1-leaf4
!
no aaa root
!
username admin privilege 15 role network-admin secret sha512 $6$clabdemo$udbS2k1uhP9eypzqZ45rzDGMYtUkb8vjs1PQZDigT0rhpvns0hNVbebg.iHvUkPWAiNWWBxhWJ3r3FBKJf9X20
!
service routing protocols model multi-agent
!
hostname dc1-leaf4
!
spanning-tree mode none
!
vrf instance MGMT
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
vrf instance TENANT_A
!
interface Ethernet1
   description SERVER_dc1-host4_eth1
   no switchport
   vrf TENANT_A
   ip address 10.1.1.6/31
!
interface Ethernet49
   description P2P_dc1-spine1_Ethernet4
   mtu 9214
   no switchport
   ip address 10.1.0.7/31
!
interface Ethernet50
   description P2P_dc1-spine2_Ethernet4
   mtu 9214
   no switchport
   ip address 10.1.0.15/31
!
interface Loopback0
   description ROUTER_ID
   ip address 10.255.0.14/32
!
interface Loopback1
   description VTEP_VXLAN_TUNNEL_SOURCE
   ip address 10.255.1.14/32
!
interface Management1
   description OOB_MANAGEMENT
   vrf MGMT
   ip address 10.20.20.9/24
!
ip routing
no ip routing vrf MGMT
!
ip route vrf MGMT 0.0.0.0/0 10.20.20.1
!
ip routing vrf TENANT_A
!
interface Vxlan1
   description dc1-leaf4_VTEP
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vrf TENANT_A vni 50001
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 10.255.0.0/24 eq 32
   seq 20 permit 10.255.1.0/24 eq 32
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bgp 65104
   router-id 10.255.0.14
   no bgp default ipv4-unicast
   distance bgp 20 200 200
   maximum-paths 4 ecmp 4
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS send-community
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 12000
   neighbor 10.1.0.6 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.1.0.6 remote-as 65100
   neighbor 10.1.0.6 description dc1-spine1_Ethernet4
   neighbor 10.1.0.14 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.1.0.14 remote-as 65100
   neighbor 10.1.0.14 description dc1-spine2_Ethernet4
   neighbor 10.255.0.1 peer group EVPN-OVERLAY-PEERS
   neighbor 10.255.0.1 remote-as 65100
   neighbor 10.255.0.1 description dc1-spine1_Loopback0
   neighbor 10.255.0.2 peer group EVPN-OVERLAY-PEERS
   neighbor 10.255.0.2 remote-as 65100
   neighbor 10.255.0.2 description dc1-spine2_Loopback0
   redistribute connected route-map RM-CONN-2-BGP
   !
   address-family evpn
      neighbor EVPN-OVERLAY-PEERS activate
   !
   address-family ipv4
      neighbor IPv4-UNDERLAY-PEERS activate
   !
   vrf TENANT_A
      rd 10.255.0.14:50001
      route-target import evpn 50001:50001
      route-target export evpn 50001:50001
      router-id 10.255.0.14
      redistribute connected
!
end
