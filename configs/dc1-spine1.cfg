! Startup config of dc1-spine1
!
no aaa root
!
username admin privilege 15 role network-admin secret sha512 $6$clabdemo$udbS2k1uhP9eypzqZ45rzDGMYtUkb8vjs1PQZDigT0rhpvns0hNVbebg.iHvUkPWAiNWWBxhWJ3r3FBKJf9X20
!
service routing protocols model multi-agent
!
hostname dc1-spine1
!
spanning-tree mode none
!
vrf instance MGMT
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
interface Ethernet1
   description P2P_dc1-leaf1_Ethernet49
   mtu 9214
   no switchport
   ip address 10.1.0.0/31
!
interface Ethernet2
   description P2P_dc1-leaf2_Ethernet49
   mtu 9214
   no switchport
   ip address 10.1.0.2/31
!
interface Ethernet3
   description P2P_dc1-leaf3_Ethernet49
   mtu 9214
   no switchport
   ip address 10.1.0.4/31
!
interface Ethernet4
   description P2P_dc1-leaf4_Ethernet49
   mtu 9214
   no switchport
   ip address 10.1.0.6/31
!
interface Loopback0
   description ROUTER_ID
   ip address 10.255.0.1/32
!
interface Management1
   description OOB_MANAGEMENT
   vrf MGMT
   ip address 10.20.20.10/24
!
ip routing
no ip routing vrf MGMT
!
ip route vrf MGMT 0.0.0.0/0 10.20.20.1
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 10.255.0.0/24 eq 32
   seq 20 permit 10.255.1.0/24 eq 32
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bgp 65100
   router-id 10.255.0.1
   no bgp default ipv4-unicast
   distance bgp 20 200 200
   maximum-paths 4 ecmp 4
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS next-hop-unchanged
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS send-community
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 12000
   neighbor 10.1.0.1 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.1.0.1 remote-as 65101
   neighbor 10.1.0.1 description dc1-leaf1_Ethernet49
   neighbor 10.1.0.3 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.1.0.3 remote-as 65102
   neighbor 10.1.0.3 description dc1-leaf2_Ethernet49
   neighbor 10.1.0.5 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.1.0.5 remote-as 65103
   neighbor 10.1.0.5 description dc1-leaf3_Ethernet49
   neighbor 10.1.0.7 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.1.0.7 remote-as 65104
   neighbor 10.1.0.7 description dc1-leaf4_Ethernet49
   neighbor 10.255.0.11 peer group EVPN-OVERLAY-PEERS
   neighbor 10.255.0.11 remote-as 65101
   neighbor 10.255.0.11 description dc1-leaf1_Loopback0
   neighbor 10.255.0.12 peer group EVPN-OVERLAY-PEERS
   neighbor 10.255.0.12 remote-as 65102
   neighbor 10.255.0.12 description dc1-leaf2_Loopback0
   neighbor 10.255.0.13 peer group EVPN-OVERLAY-PEERS
   neighbor 10.255.0.13 remote-as 65103
   neighbor 10.255.0.13 description dc1-leaf3_Loopback0
   neighbor 10.255.0.14 peer group EVPN-OVERLAY-PEERS
   neighbor 10.255.0.14 remote-as 65104
   neighbor 10.255.0.14 description dc1-leaf4_Loopback0
   redistribute connected route-map RM-CONN-2-BGP
   !
   address-family evpn
      neighbor EVPN-OVERLAY-PEERS activate
   !
   address-family ipv4
      neighbor IPv4-UNDERLAY-PEERS activate
!
end
